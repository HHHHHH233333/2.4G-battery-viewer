name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.22.3

      - name: Build onefile EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "2.4G-Battery-Viewer" --icon app.ico --manifest app.manifest --runtime-tmpdir . battery_viewer.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/2.4G-Battery-Viewer.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
