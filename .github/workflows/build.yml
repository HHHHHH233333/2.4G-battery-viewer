name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.22.3

      - name: Build onefile EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "2.4G-Battery-Viewer" --icon app.ico --manifest app.manifest --runtime-tmpdir . battery_viewer.py

      - name: Generate release body from version.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          d = json.load(open('version.json', encoding='utf-8'))
          notes = d.get('notes') or '无更新说明'
          body = "### 更新说明\n\n" + notes + "\n\n---\n\n下载下方 Assets 中的 `2.4G-Battery-Viewer.exe`，双击运行，无需安装。\n"
          open('release-body.md', 'w', encoding='utf-8').write(body)
          PY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/2.4G-Battery-Viewer.exe
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
